name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-history scan

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan working tree + git history
        run: python secret-scanner.py --git-history
